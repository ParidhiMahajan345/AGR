<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Photo Gallery — Design Your Degree</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#000080; --deep:#00001e; --mid:#000048; --gold:#c8a84b; --gold-lt:#f0dca0;
  --ink:#dbe4f8; --dim:#8b9bc4;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--deep);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
img{display:block;width:100%;height:100%;object-fit:cover;}
::selection{background:var(--gold);color:#000;}

/* ════════ CINEMATIC OPENING ════════
   Poster layout: the title sits first on the dark background, then the
   photo appears as its own framed card beneath it. The photo is never
   layered under text, so faces are never covered — and the framed card
   reads as a deliberate editorial choice rather than a cropped overlay. */
.hero{position:relative;text-align:center;padding:92px 24px 54px;overflow:hidden;}
.hero::before{content:"";position:absolute;top:-220px;left:50%;transform:translateX(-50%);
  width:min(900px,140%);height:640px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(0,0,150,.35) 0%,transparent 70%);filter:blur(40px);}

.kicker{position:relative;font-size:11px;letter-spacing:6px;color:var(--gold);font-weight:500;
  opacity:0;animation:up 1.1s .2s ease forwards;}
.hero h1{position:relative;font-family:'DM Serif Display',serif;font-size:clamp(38px,7vw,96px);
  line-height:.95;color:#fff;margin-top:18px;letter-spacing:-1.5px;
  opacity:0;animation:up 1.3s .45s ease forwards;}
.hero h1 i{display:block;font-style:italic;color:var(--gold-lt);}
.thread{position:relative;width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:26px auto 0;animation:widen 1.6s 1.2s ease forwards;}
.hero .sub{position:relative;margin:22px auto 0;font-size:13.5px;font-weight:200;letter-spacing:2px;
  color:#b9c6e2;max-width:42ch;opacity:0;animation:up 1.2s 1.4s ease forwards;}
@keyframes up{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}
@keyframes widen{to{width:min(300px,50vw);}}

/* the photo, as a framed card */
.frame-box{position:relative;max-width:1060px;margin:42px auto 0;border-radius:14px;overflow:hidden;
  aspect-ratio:16/7.4;box-shadow:0 44px 90px rgba(0,0,0,.55),0 0 0 1px rgba(200,168,75,.28);
  opacity:0;transform:translateY(20px) scale(.98);animation:cardin 1.3s .75s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes cardin{to{opacity:1;transform:none;}}
.frame-box .frame{position:absolute;inset:0;opacity:0;transition:opacity 2s ease;}
.frame-box .frame.live{opacity:1;}
.frame-box .frame img{transform:scale(1.08);animation:drift 15s ease-out forwards;object-position:center 32%;}
@keyframes drift{from{transform:scale(1.03) translate3d(0,0,0);}to{transform:scale(1.14) translate3d(-1.5%,-1.5%,0);}}
.frame-box .wash{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,20,.34) 0%,transparent 45%),
  linear-gradient(to bottom,rgba(0,0,20,.22) 0%,transparent 30%);
  box-shadow:inset 0 0 60px rgba(0,0,10,.4);}
.frame-box .grain{position:absolute;inset:0;opacity:.4;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);}

.cue{position:relative;display:block;margin:34px auto 0;z-index:4;
  color:var(--gold);font-size:10px;letter-spacing:4px;opacity:0;animation:up 1s 2.1s ease forwards;text-align:center;}
.cue span{display:block;width:1px;height:26px;margin:10px auto 0;
  background:linear-gradient(var(--gold),transparent);animation:slide 2.2s ease-in-out infinite;}
@keyframes slide{0%,100%{opacity:.25;transform:scaleY(.55);transform-origin:top;}50%{opacity:1;transform:scaleY(1);}}

/* ════════ GALLERY ════════ */
.wrap{position:relative;max-width:1280px;margin:0 auto;padding:10px 20px 110px;}
.wrap::before{content:"";position:absolute;top:-180px;left:50%;transform:translateX(-50%);
  width:min(820px,100%);height:820px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(0,0,160,.30) 0%,transparent 68%);filter:blur(30px);}

.grid{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:16px;}

.pic{grid-column:span 4;height:270px;position:relative;overflow:hidden;border-radius:6px;
  background:var(--mid);cursor:pointer;border:0;padding:0;
  box-shadow:0 18px 44px rgba(0,0,0,.5);
  opacity:0;transform:translateY(46px) scale(.97);
  transition:opacity .9s cubic-bezier(.2,.7,.3,1),transform .9s cubic-bezier(.2,.7,.3,1),box-shadow .45s ease;}
.pic.seen{opacity:1;transform:none;}
/* shifting rhythm so no two screens repeat */
.pic:nth-child(7n+1){grid-column:span 7;height:340px;}
.pic:nth-child(7n+2){grid-column:span 5;height:340px;}
.pic:nth-child(7n+6){grid-column:span 6;height:300px;}
.pic:nth-child(7n+7){grid-column:span 6;height:300px;}

.pic img{transform:scale(1.04);transition:transform 1.1s cubic-bezier(.2,.7,.3,1),filter .6s ease;
  filter:saturate(.92) brightness(.88);}
.pic:hover img,.pic:focus-visible img{transform:scale(1.13);filter:saturate(1.08) brightness(1.04);}
.pic:hover,.pic:focus-visible{box-shadow:0 34px 70px rgba(0,0,0,.65),0 0 0 1px var(--gold);}

/* gold sheen sweeping across on hover */
.pic::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(240,220,160,.20) 50%,transparent 62%);
  transform:translateX(-120%);transition:transform .9s ease;}
.pic:hover::after,.pic:focus-visible::after{transform:translateX(120%);}

.cap{position:absolute;left:0;right:0;bottom:0;padding:54px 18px 16px;text-align:left;
  background:linear-gradient(to top,rgba(0,0,22,.95) 12%,rgba(0,0,22,.55) 55%,transparent);
  transform:translateY(12px);opacity:0;transition:.45s cubic-bezier(.2,.7,.3,1);}
.pic:hover .cap,.pic:focus-visible .cap{transform:none;opacity:1;}
.cap b{display:block;width:22px;height:2px;background:var(--gold);margin-bottom:9px;}
.cap span{font-size:13.5px;font-weight:300;color:#fff;line-height:1.5;letter-spacing:.2px;}

/* ════════ VIEWER ════════ */
.lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  flex-direction:column;padding:26px;background:rgba(0,0,16,.9);backdrop-filter:blur(22px);}
.lb.on{display:flex;animation:fadein .4s ease;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.lb figure{max-width:94vw;max-height:76vh;display:flex;align-items:center;justify-content:center;
  animation:pop .5s cubic-bezier(.2,.8,.3,1);}
@keyframes pop{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
.lb img{width:auto;height:auto;max-width:94vw;max-height:76vh;object-fit:contain;border-radius:4px;
  box-shadow:0 40px 90px rgba(0,0,0,.8),0 0 0 1px rgba(200,168,75,.35);}
.lb .txt{margin-top:20px;text-align:center;font-size:14px;font-weight:200;letter-spacing:.6px;color:#cfdaf2;}
.lb .idx{position:absolute;top:24px;left:28px;font-size:11px;letter-spacing:3px;color:var(--gold);}
.btn{position:absolute;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
  color:#fff;cursor:pointer;transition:.25s;}
.btn:hover{background:var(--navy);border-color:var(--gold);}
.x{top:22px;right:26px;width:42px;height:42px;border-radius:50%;font-size:18px;}
.arw{top:50%;transform:translateY(-50%);width:50px;height:76px;font-size:26px;border-radius:4px;}
.l{left:18px;} .r{right:18px;}

.end{text-align:center;padding:52px 20px 60px;border-top:1px solid rgba(200,168,75,.18);
  font-size:11.5px;letter-spacing:2.5px;color:var(--dim);}
.end b{display:block;font-family:'DM Serif Display',serif;font-size:19px;color:var(--gold);
  letter-spacing:0;margin-bottom:9px;font-weight:400;}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(6,1fr);gap:12px;}
  .pic,.pic:nth-child(7n+1),.pic:nth-child(7n+2),.pic:nth-child(7n+6),.pic:nth-child(7n+7){
    grid-column:span 3;height:200px;}
  .hero h1{letter-spacing:-1px;}
  .hero{padding:64px 20px 40px;}
  .frame-box{aspect-ratio:4/3.1;margin-top:32px;}
}
@media(max-width:560px){
  .pic,.pic:nth-child(7n+1),.pic:nth-child(7n+2),.pic:nth-child(7n+6),.pic:nth-child(7n+7){
    grid-column:span 6;height:230px;}
  .cap{opacity:1;transform:none;}
  .arw{width:40px;height:62px;font-size:21px;}
  .wrap{padding:10px 14px 80px;}
  .hero{padding:52px 18px 34px;}
  .frame-box{aspect-ratio:4/3.6;margin-top:26px;border-radius:10px;}
  .hero .sub{display:none;}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
  .pic{opacity:1;transform:none;}
  .thread{width:260px;} .kicker,.hero h1,.hero .sub,.cue,.frame-box{opacity:1;}
}
</style>
</head>
<body>

<!-- ════ OPENING ════ -->
<header class="hero">
  <div class="kicker">UNIVERSITY OF JAMMU</div>
  <h1>Design Your<i>Degree</i></h1>
  <div class="thread"></div>
  <div class="frame-box" id="stage">
    <div class="wash"></div><div class="grain"></div>
  </div>
  <p class="sub">Every classroom, stage, lab and lawn — as we lived it.</p>
  <div class="cue">SCROLL<span></span></div>
</header>

<!-- ════ GALLERY ════ -->
<main class="wrap"><div class="grid" id="grid"></div></main>

<div class="end">
  <b>Design Your Degree</b>
  UNIVERSITY OF JAMMU · JAMMU &amp; KASHMIR
</div>

<!-- ════ VIEWER ════ -->
<div class="lb" id="lb">
  <div class="idx"><b id="cur">1</b> — <span id="tot"></span></div>
  <button class="btn x" id="x" aria-label="Close">✕</button>
  <button class="btn arw l" id="pv" aria-label="Previous">‹</button>
  <figure><img id="big" alt=""/></figure>
  <button class="btn arw r" id="nx" aria-label="Next">›</button>
  <div class="txt" id="txt"></div>
</div>

<script>
const DIR="PHOTO GALLERY/";

const PHOTOS=[
 ["ADDED.jpeg","INAUGURAL OF DESIGN YOUR DEGREE PRE-FAB BUILDING"],
 ["ADDED2.jpeg","KABIRA KHADA BAZAAR MA INACTMENT DONE BY 1ST BATCH OF DYD"],
 ["jr5.jpeg","RASHMIRATHI INACTMENT DONE BY THE 2ND BATCH OF DYD"],
 ["p1.jpeg","STUDENTS OF DYD WINNING THIRD PRIZE IN AI CRAFT 3.1 AT AMITY UNIVERSITY"],
 ["NEWW2.jpeg","IDEATION WORKSHOP CONDUCTED BY E-YANTRA AT IUST "],
 ["PIK4.jpeg","WORKSHOP ON THE AI SKILLS AND ADVANCE EXCEL ATTENDED BY THE STUDENTS OF DYD"],
 ["NEWW12.jpeg","CAST AND GUEST OF O MAYAVI SAROVAR BY STUDENTS OF 3RD BATCH OF DYD"],
 ["p7.jpeg","AT INTERNATIONAL POLICE EXPO 2025"],
 ["NEWW15.jpeg","INAUGURAL OF SHODH SAHAYAK JAMMU UNIVERSITY FIRST PIONEER APP "],
 ["jr4.jpeg","CAST OF RASHMI RATHI_ SECOND BATCH OF DYD"],
 ["NEWW.jpeg","INTERACTION OF STUDENTS OF DYD WITH THE GUEST FROM ISRO"],
 ["p11.jpeg","TEAM ANUBHAVX WINS SECOND PRIZE AT INNOVOTHON NATHONAL LEVEL HACKATHON CONDUCTED BY THE UNIVERSITY OF JAMMU"],
 ["PK6.jpeg","CROWDED AROUND THE DESK HANDS ON ACTIVITY ABOUT LEARNING HOW TO DO NETWORKING IN THE LAB"],
 ["NEWW7.jpeg","TENTS PITCHED ON CAMPUS GROUND"],
 ["NEWW13.jpeg","A SCENE IN PERFORMANCE OF O MAYAVI SAROVAR"],
 ["NEWW3.jpeg","WORKSHOP ON EYE TRACKING AT IIT JAMMU "],
 ["p4.jpeg","STUDENTS OF DYD PRESENTING THE DEPARTMEN'S STALL IN GOONJ 2026 AT JAMMU UNIVERSITY  "],
 ["jr1.jpeg","DYD SECOND BATCH WINS THE MOMENTO FOR THEIR INACTMENT RASHMI RATHI"],
 ["PIK3.jpeg","DYD GIRL STUDENT COHORT AT IISC BANGLORE_ COLLEGE ON WHEELS"],
 ["p10.jpeg","TEAM DUPAHAR WINS FIRST PRIZE AT INNOVOTHON NATIONAL LEVEL HACKATHON AT JAMMU UNIVERSITY"],
 ["NEWW9.jpeg","FORMAL GROUP PHOTOGRAPH OF THE STUDENTS AND MENTORS OF DESIGN YOUR DEGREE WITH HONARABLE LG"],
 ["agrivimaan.jpeg","TEAM AGRIVIMAN WINS FIRST PRIZE AT SPARK TANK SAMADHAN 2025 "],
 ["WhatsApp Image 2026-09-16 at 8.58.09 PM.jpeg","DYD GIRL STUDENT COHORT AT AHMEDABAD UNIVERSITY_ COLLEGE ON WHEELS INSIGHT"],
 ["p5.jpeg"," A WEEK WORKSHOP FOR STUDENTS OF DESIGN YOUR DEGREE ON NEUROFUSSION"],
 ["jr2.jpeg","DYD STUDENTS RECEIVING MOMENTO ON THEIR STARTUP STALL FOR HONOURABLE VICE CHANCELLOR OF UNIVERSITY OF JAMMU"],
 ["PK8.jpeg","POSTER PRESENTATION BY STUDENTS OF DESIGN YOUR DEGREE ON THE OCASSION OF NATIONAL SPACE DAY IN THE DEPT. OF PHYSICS OF UNIVERSITY OF JAMMU"],
 ["clear pic.jpeg","INTERACTION OF STUDENTS OF DYD WITH VICE CHAIRAM HEC LT.GOVERNOR SHRI.MANOJ SINHA JI "],
 ["p2.jpeg","STUDENTS OF DESIGN YOUR DEGREE UPHOLDING THE FLAG OF THEIR ACHIEVEMNTS AT JAMMUIYAT"],
 ["NEWW5.jpeg","STUDENTS OF DESIGN YOUR DEGREE AT CIC DELHI"],
 ["PIK7.jpeg","STUDENTS OF DESIGN YOUR DEGREE PRESENTING THEIR STALL AT SCIENCE COLLEGE"],
 ["jr10.jpeg","CLEANLINESS DRIVE BY THE STUDENTS OF DYD "],
 ["pic12.png","India Innovates 2026 · Bharat Mandapam, New Delhi Team Dupahar Reaches National Finale AT INDIA INNOVATES 2026 AT BHARAT MANDAPPAM, NEW DELHI "],
 ["p3.jpeg","TEAM ANNUBHAVX FROM DYD WINS SECOND PRIZE AT EKTAVA MODEL PRESENTATION AT SHRI MATA VAISHNO DEVI UNIVERSITY"],
 ["NEWW4.jpeg","WORKSHOP ON STORY TELLING ATTENDED BY STUDENTS OF DYD"],
 ["ADDED 5.jpeg","STUDENTS OF DYD AT POLICE STATION CONCLUDING THEIR 45 DAYS OF WORKSHOP"],
 ["ADDED 4.jpeg","STUDENTS OF DYD AT IIT JAMMU"],
 ["ADDED 3.jpeg","STUDENTS OF DYD AT IIT ROORKEE"],
 ["WhatsApp Image 2026-09-16 at 8.58.08 PM.jpeg","GIRL STUDENT CONTIGENT MOVING FORWARDS TOWARDS THEIR JOURNEY FOR COLLEGE ON WHEELS"],
 ["p6.jpeg","STUDENTS OF DYD AT INTERNATIONAL POLICE EXPO SHOWCASING THEIR MOBILE BASED FORENSIC APP"],
 ["PIK5.jpeg","COMMUNICATION WORKSHOP ATTENDED BY THE DYDIANS"],
 ["jr8.jpeg","STUDENTS OF DYD AT INTERNATIONAL CONFERENCE AT BHADERWAH"],
 ["p8.jpeg","STUDENTS OF DYD AT IIT BOMABAY FOR THEIR ONE MONTH INTERNSHIP"],
 ["PIK2.jpeg","STUDENTS OF DYD WITH HONARABLE VICE CHANCELLOR PROF. UMESH RAI, UNIVERSITY OF JAMMU"],
 ["p9.jpeg","STUDENTS OF DYD WITH HONARABLE VICE CHNACELLOR PROF. UMESH RAI WITH THEIR WINNINGS AT STATE LEVEL HACKATHON IUST KASHMIR"],
];
 

const full  = f => DIR + encodeURIComponent(f);
const small = f => DIR + "thumbs/" + encodeURIComponent(f.replace(/\.[^.]+$/,"")) + ".jpg";
function setSrc(img,f){
  img.onerror=function(){ if(this.dataset.fb!=="1"){this.dataset.fb="1";this.src=full(f);} };
  img.src=small(f);
}

/* ---- opening slideshow ---- */
(function(){
  const reel=["NEWW4.jpeg","jr5.jpeg","NEWW2.jpeg","p7.jpeg","NEWW12.jpeg","PIK4.jpeg"];
  const stage=document.getElementById("stage");
  const frames=reel.map((f,i)=>{
    const d=document.createElement("div"); d.className="frame";
    const im=document.createElement("img"); im.alt=""; setSrc(im,f);
    d.appendChild(im); stage.insertBefore(d,stage.firstChild);
    return d;
  });
  let k=0; frames[0].classList.add("live");
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    setInterval(()=>{
      frames[k].classList.remove("live");
      k=(k+1)%frames.length;
      const im=frames[k].querySelector("img");
      im.style.animation="none"; void im.offsetWidth; im.style.animation="";
      frames[k].classList.add("live");
    },5200);
  }
})();

/* ---- gallery ---- */
const grid=document.getElementById("grid");
PHOTOS.forEach(([f,t],i)=>{
  const fig=document.createElement("figure");
  fig.className="pic"; fig.tabIndex=0; fig.setAttribute("role","button"); fig.setAttribute("aria-label",t);
  const im=document.createElement("img"); im.alt=t; im.loading="lazy"; setSrc(im,f);
  const c=document.createElement("figcaption"); c.className="cap";
  c.innerHTML='<b></b><span></span>'; c.querySelector("span").textContent=t;
  fig.append(im,c);
  fig.onclick=()=>open_(i);
  fig.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();open_(i);} };
  grid.appendChild(fig);
});

/* rise into view, staggered */
const io=new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){
    const row=[...grid.children].indexOf(e.target)%3;
    setTimeout(()=>e.target.classList.add("seen"),row*130);
    o.unobserve(e.target);
  }});
},{rootMargin:"0px 0px -60px 0px"});
[...grid.children].forEach(el=>io.observe(el));

/* ---- viewer ---- */
const lb=document.getElementById("lb"),big=document.getElementById("big"),
      txt=document.getElementById("txt"),cur=document.getElementById("cur");
document.getElementById("tot").textContent=PHOTOS.length;
let i=0;
function show(k){ i=(k+PHOTOS.length)%PHOTOS.length;
  big.src=full(PHOTOS[i][0]); big.alt=PHOTOS[i][1];
  txt.textContent=PHOTOS[i][1]; cur.textContent=i+1; }
function open_(k){ lb.classList.add("on"); document.body.style.overflow="hidden"; show(k); }
function close_(){ lb.classList.remove("on"); document.body.style.overflow=""; big.removeAttribute("src"); }
document.getElementById("x").onclick=close_;
document.getElementById("pv").onclick=()=>show(i-1);
document.getElementById("nx").onclick=()=>show(i+1);
lb.onclick=e=>{ if(e.target===lb) close_(); };
document.onkeydown=e=>{ if(!lb.classList.contains("on"))return;
  if(e.key==="Escape")close_(); else if(e.key==="ArrowLeft")show(i-1); else if(e.key==="ArrowRight")show(i+1); };
let sx=null;
lb.addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{ if(sx===null)return;
  const d=e.changedTouches[0].clientX-sx; if(Math.abs(d)>55) show(d>0?i-1:i+1); sx=null; },{passive:true});
</script>
</body>
</html>
